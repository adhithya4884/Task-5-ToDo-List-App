<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-lg mx-4">
        
        <header class="text-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800">My To-Do List</h1>
            <p class="text-gray-500 mt-2">Stay organized, get things done.</p>
        </header>

        <form id="add-task-form" class="flex gap-3 mb-6">
            <input 
                type="text" 
                id="task-input" 
                placeholder="e.g., Finish internship project" 
                class="flex-grow p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-indigo-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105"
            >
                Add
            </button>
        </form>

        <div id="task-list-container">
            <ul id="task-list" class="space-y-3"></ul>
            <p id="empty-message" class="text-center text-gray-500 py-8 hidden">You have no tasks yet. Add one above!</p>
        </div>

        <footer id="task-footer" class="mt-6 pt-4 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between text-sm text-gray-500 gap-4 hidden">
            <span id="task-counter">3 tasks left</span>
            <div id="filters" class="flex gap-4">
                <button data-filter="all" class="filter-btn active">All</button>
                <button data-filter="active" class="filter-btn">Active</button>
                <button data-filter="completed" class="filter-btn">Completed</button>
            </div>
            <button id="clear-completed-btn" class="hover:text-red-500 transition">Clear Completed</button>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
